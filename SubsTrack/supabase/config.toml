
[functions.create-user]
enabled = true
verify_jwt = true
import_map = "./functions/create-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-user/*.html" ]

# Public: the customer portal calls this with no session at all. Must stay
# verify_jwt = false, and must be deployed with --no-verify-jwt to match.
[functions.customer-portal]
enabled = true
verify_jwt = false
entrypoint = "./functions/customer-portal/index.ts"

# WhatsApp Cloud API (docs/whatsapp.md). Staff calls carry a JWT.
[functions.whatsapp-admin]
enabled = true
verify_jwt = true
entrypoint = "./functions/whatsapp-admin/index.ts"

[functions.whatsapp-send]
enabled = true
verify_jwt = true
entrypoint = "./functions/whatsapp-send/index.ts"

# Public: the web signup page (one-time session token), pg_cron (worker secret)
# and Meta (signed webhooks) call these with no Supabase session.
[functions.whatsapp-onboard]
enabled = true
verify_jwt = false
entrypoint = "./functions/whatsapp-onboard/index.ts"

[functions.whatsapp-worker]
enabled = true
verify_jwt = false
entrypoint = "./functions/whatsapp-worker/index.ts"

[functions.whatsapp-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/whatsapp-webhook/index.ts"
